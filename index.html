<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020711">
<title></title>
<style>
:root {
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #020711;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
}
body {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  min-height: 100svh;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,120,180,.06), transparent 28%),
    radial-gradient(circle at 25% 70%, rgba(0,90,200,.04), transparent 34%),
    #020711;
}
canvas {
  position: fixed;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100dvh;
}
#symbol {
  position: fixed;
  left: 50%;
  top: 50%;
  width: clamp(96px, 22vmin, 220px);
  max-width: 28vw;
  height: auto;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: .99;
  will-change: transform, filter;
  filter:
    drop-shadow(0 0 6px rgba(180,255,255,.98))
    drop-shadow(0 0 16px rgba(0,230,255,.70))
    drop-shadow(0 0 32px rgba(0,125,255,.30));
}
#tap {
  position: fixed;
  left: 50%;
  top: 50%;
  width: clamp(54px, 12vmin, 82px);
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  border: 1px solid rgba(105,255,255,.68);
  background:
    radial-gradient(circle, rgba(170,255,255,.24) 0 12%, rgba(0,230,255,.10) 13% 34%, rgba(0,180,255,.03) 35% 58%, transparent 59%);
  box-shadow:
    0 0 14px rgba(0,245,255,.75),
    0 0 34px rgba(0,175,255,.35),
    inset 0 0 20px rgba(0,240,255,.15);
  animation: breathe 1.7s ease-in-out infinite;
  transition: opacity .3s ease, transform .3s ease;
}
body.live #tap {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(.65);
}
body.error #tap {
  border-color: rgba(255,110,110,.9);
  box-shadow:
    0 0 14px rgba(255,80,80,.75),
    0 0 34px rgba(255,0,0,.28);
}
@keyframes breathe {
  0%,100% { transform: translate(-50%, -50%) scale(.92); opacity:.58; }
  50% { transform: translate(-50%, -50%) scale(1.08); opacity:.95; }
}
#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow:
    inset 0 0 120px rgba(0,0,0,.72),
    inset 0 0 30px rgba(0,0,0,.45);
}
@media (orientation: portrait) {
  #symbol {
    width: clamp(88px, 24vmin, 180px);
    max-width: 34vw;
  }
}
@media (max-width: 480px) {
  #vignette {
    box-shadow:
      inset 0 0 80px rgba(0,0,0,.62),
      inset 0 0 18px rgba(0,0,0,.38);
  }
}
</style>
</head>

<div id="tap"></div>
<div id="vignette"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const symbol = document.getElementById('symbol');
  const tap = document.getElementById('tap');

  let W=0,H=0,DPR=1,cx=0,cy=0,R=180;
  let analyser=null, audioCtx=null, freq=null, wave=null, stream=null;
  let active=false;
  let t=0;

  let rms=0, level=0, bass=0, mids=0, highs=0;
  let transient=0, prevNorm=0, noiseFloor=.014, adaptivePeak=.055;
  let stars=[], particles=[];

  function viewportSize() {
    const vv = window.visualViewport;
    return {
      w: vv ? vv.width : window.innerWidth,
      h: vv ? vv.height : window.innerHeight
    };
  }

  function resize() {
    const v = viewportSize();
    W = Math.max(1, Math.floor(v.w));
    H = Math.max(1, Math.floor(v.h));
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    cx = W * .5;
    cy = H * .5;

    // Use the shortest side on mobile, with tighter framing in portrait.
    const minSide = Math.min(W,H);
    R = minSide * (H > W ? .34 : .30);

    stars = Array.from({length: Math.max(70, Math.floor(W*H/4500))}, () => ({
      x: Math.random()*W,
      y: Math.random()*H,
      r: .2+Math.random()*1.1,
      a: .10+Math.random()*.62,
      p: Math.random()*Math.PI*2,
      s: .18+Math.random()*.75
    }));
  }

  addEventListener('resize', resize, {passive:true});
  addEventListener('orientationchange', () => setTimeout(resize, 120), {passive:true});
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', resize, {passive:true});
    visualViewport.addEventListener('scroll', resize, {passive:true});
  }
  resize();

  async function startMic() {
    if (active) return;
    document.body.classList.remove('error');

    if (!navigator.mediaDevices?.getUserMedia) {
      document.body.classList.add('error');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = .42;
      src.connect(analyser);

      freq = new Uint8Array(analyser.frequencyBinCount);
      wave = new Uint8Array(analyser.fftSize);

      active = true;
      document.body.classList.add('live');
    } catch (err) {
      document.body.classList.add('error');
      console.error(err);
    }
  }

  tap.addEventListener('pointerdown', startMic, {passive:true});
  document.body.addEventListener('pointerdown', () => {
    if (!active) startMic();
  }, {passive:true});

  function avg(a,b) {
    if (!freq) return 0;
    let s=0,n=0;
    for(let i=a;i<b && i<freq.length;i++) {
      s += freq[i];
      n++;
    }
    return n ? s/(n*255) : 0;
  }

  function updateAudio() {
    if (!analyser) {
      level *= .94; bass *= .94; mids *= .94; highs *= .94; transient *= .86;
      return;
    }

    analyser.getByteTimeDomainData(wave);
    analyser.getByteFrequencyData(freq);

    let sq=0;
    let abs=0;
    for (let i=0;i<wave.length;i++) {
      const v=(wave[i]-128)/128;
      sq += v*v;
      abs += Math.abs(v);
    }
    rms = Math.sqrt(sq / wave.length);
    const meanAbs = abs / wave.length;

    // Adaptive noise floor: learns silence slowly, but does not chase speech upward.
    if (rms < noiseFloor * 1.65) {
      noiseFloor = noiseFloor*.994 + rms*.006;
    }
    noiseFloor = Math.max(.0045, Math.min(.045, noiseFloor));

    // Voice-sensitive gate and normalization.
    const gated = Math.max(0, rms - noiseFloor*.93);
    adaptivePeak = Math.max(adaptivePeak*.982, gated, .018);

    let norm = gated / (adaptivePeak*.62 + .00001);
    norm = Math.max(0, Math.min(1.25, norm));

    // Add mean absolute amplitude so speech is visibly responsive even on phones.
    norm = Math.min(1.25, norm*.82 + Math.min(1, meanAbs*7.5)*.35);

    const b = Math.min(1, avg(1,24)*2.7);
    const m = Math.min(1, avg(24,120)*3.1);
    const h = Math.min(1, avg(120,360)*4.0);

    level += (norm-level) * (norm > level ? .48 : .14);
    bass  += (b-bass) * .28;
    mids  += (m-mids) * .30;
    highs += (h-highs) * .32;

    const d = Math.max(0, norm - prevNorm);
    if (d > .045) transient = Math.min(1, transient + d*7.5);
    transient *= .76;
    prevNorm = norm;

    const scale = 1 + level*.085 + transient*.04;
    const glow1 = 6 + level*11 + transient*6;
    const glow2 = 16 + level*34 + transient*20;
    const glow3 = 28 + level*52;

    symbol.style.transform = `translate(-50%,-50%) scale(${scale})`;
    symbol.style.filter =
      `drop-shadow(0 0 ${glow1}px rgba(180,255,255,.99)) `+
      `drop-shadow(0 0 ${glow2}px rgba(0,235,255,.82)) `+
      `drop-shadow(0 0 ${glow3}px rgba(0,125,255,.38))`;
  }

  function background() {
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);
    g.addColorStop(0, `rgba(0,34,58,${.88 + Math.min(level,.8)*.05})`);
    g.addColorStop(.3, 'rgba(2,17,34,.99)');
    g.addColorStop(.72, 'rgba(1,8,19,1)');
    g.addColorStop(1, 'rgba(0,3,9,1)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    for(const s of stars) {
      const tw=.28+.72*(Math.sin(t*s.s+s.p)*.5+.5);
      ctx.fillStyle=`rgba(125,215,255,${s.a*tw})`;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function ring(radius, alpha, width, dash=[]) {
    ctx.save();
    ctx.setLineDash(dash);
    ctx.lineWidth=width;
    ctx.strokeStyle=`rgba(65,235,255,${alpha})`;
    ctx.shadowColor='rgba(0,225,255,.9)';
    ctx.shadowBlur=8+level*24;
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function reactiveRing(radius, baseAmp, lobes, phase, alpha, width) {
    const points=320;
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<=points;i++) {
      const a=i/points*Math.PI*2;

      const speechAmp = level * R * .14;
      const transientAmp = transient * R * .05;
      const midsAmp = mids * R * .045;
      const highsAmp = highs * R * .018;

      const mod =
        Math.sin(a*lobes+phase)*(baseAmp + speechAmp + transientAmp) +
        Math.sin(a*(lobes*1.82)-phase*.64)*midsAmp +
        Math.sin(a*21+phase*2.2)*highsAmp;

      const rr=radius+mod;
      const x=cx+Math.cos(a)*rr;
      const y=cy+Math.sin(a)*rr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=`rgba(90,250,255,${Math.min(1,alpha+level*.23)})`;
    ctx.lineWidth=width+level*3.8;
    ctx.shadowColor='rgba(0,240,255,.95)';
    ctx.shadowBlur=12+level*42+transient*20;
    ctx.stroke();
    ctx.restore();
  }

  function ticks(radius) {
    ctx.save();
    for(let i=0;i<96;i++) {
      const a=i/96*Math.PI*2+t*.015;
      const e=.4+.6*Math.sin(i*.71+t*4)**2;
      const len=4+highs*22*e+level*5;
      const x1=cx+Math.cos(a)*radius;
      const y1=cy+Math.sin(a)*radius;
      const x2=cx+Math.cos(a)*(radius+len);
      const y2=cy+Math.sin(a)*(radius+len);
      ctx.strokeStyle=`rgba(80,235,255,${.10+highs*.38})`;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function waveform() {
    if (!wave) return;
    const portrait = H > W;
    const width = Math.min(W*(portrait?.94:.88), R*(portrait?2.85:5.4));
    const x0 = cx-width/2;
    const amp = Math.min(H*.15, 22 + level*R*.44);

    ctx.save();
    ctx.beginPath();

    const samples = 360;
    for(let i=0;i<=samples;i++) {
      const idx=Math.floor(i/samples*(wave.length-1));
      const v=(wave[idx]-128)/128;
      const p=i/samples;
      const fade=Math.pow(Math.sin(Math.PI*p),.55);
      const x=x0+p*width;
      const y=cy+v*amp*fade;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }

    ctx.strokeStyle=`rgba(105,250,255,${.32+Math.min(level,1)*.66})`;
    ctx.lineWidth=1+level*3;
    ctx.shadowColor='rgba(0,240,255,.98)';
    ctx.shadowBlur=10+level*30;
    ctx.stroke();
    ctx.restore();
  }

  function particlesDraw() {
    const count = Math.floor(level*14 + transient*16 + highs*4);
    for(let i=0;i<count;i++) {
      const a=Math.random()*Math.PI*2;
      const rr=R*(.9+Math.random()*.3);
      particles.push({
        x:cx+Math.cos(a)*rr,
        y:cy+Math.sin(a)*rr,
        vx:Math.cos(a)*(.2+Math.random()*1.2)*(1+level*1.8),
        vy:Math.sin(a)*(.2+Math.random()*1.2)*(1+level*1.8),
        life:1,
        r:.3+Math.random()*1.35
      });
    }
    if(particles.length>700) particles.splice(0,particles.length-700);

    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=particles.length-1;i>=0;i--) {
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=.997; p.vy*=.997;
      p.life-=.014;
      if(p.life<=0) {
        particles.splice(i,1);
        continue;
      }
      ctx.fillStyle=`rgba(65,240,255,${p.life*.66})`;
      ctx.shadowColor='rgba(0,220,255,.9)';
      ctx.shadowBlur=7;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function halo() {
    const hg=ctx.createRadialGradient(cx,cy,R*.05,cx,cy,R*.72);
    hg.addColorStop(0,`rgba(100,255,255,${.05+level*.19+transient*.08})`);
    hg.addColorStop(.45,`rgba(0,220,255,${.03+level*.10})`);
    hg.addColorStop(1,'rgba(0,80,255,0)');
    ctx.fillStyle=hg;
    ctx.beginPath();
    ctx.arc(cx,cy,R*.74,0,Math.PI*2);
    ctx.fill();
  }

  function render() {
    requestAnimationFrame(render);
    t+=.012;
    updateAudio();
    background();

    const pulseR = R*(1 + level*.075 + transient*.032);

    ring(pulseR*.68,.09+mids*.09,1);
    ring(pulseR*.83,.15+mids*.15,1.05);
    ring(pulseR,.25+Math.min(level,.9)*.31,1.4);
    ring(pulseR*1.10,.11+highs*.18,1,[2,7]);
    ring(pulseR*1.21,.07+Math.min(level,.8)*.14,1);

    ticks(pulseR*.78);

    reactiveRing(pulseR*1.11,R*.012,6.2,t*2.25,.50,2);
    reactiveRing(pulseR*1.26,R*.008,9.2,-t*1.55,.18,1);

    waveform();
    particlesDraw();
    halo();
  }

  render();
})();
</script>
</body>
</html>
